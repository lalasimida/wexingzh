# 微信公众号配置
# 需要准备以下信息：
# 1. AppID - 公众号应用ID（登录微信公众平台 -> 设置与开发 -> 基本配置）
# 2. AppSecret - 公众号应用密钥（同上页面获取）
# 3. TemplateID - 消息模板ID（登录微信公众平台 -> 功能 -> 模板消息 -> 添加模板）
# 4. ToUser - 接收消息的用户的 OpenID（需要用户关注公众号后获取）
